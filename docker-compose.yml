services:
  postgres:
    image: postgres:15
    container_name: tasktracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tasktracker-redis
    ports:
      - "6380:6379"

volumes:
  pgdata: {}
